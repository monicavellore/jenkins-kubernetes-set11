apiVersion: apps/v1
kind: Deployment
metadata:
  name: set11-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: set11-web
  template:
    metadata:
      labels:
        app: set11-web
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: web-content
          configMap:
            name: set11-web-content
---
apiVersion: v1
kind: Service
metadata:
  name: set11-web-service
spec:
  type: NodePort
  selector:
    app: set11-web
  ports:
    - port: 80
      targetPort: 80
